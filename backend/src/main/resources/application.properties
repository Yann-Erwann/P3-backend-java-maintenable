spring.application.name=backend

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:chatop}?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
spring.datasource.username=${MYSQL_USER:chatop}
spring.datasource.password=${MYSQL_PASSWORD}

# Le schéma est initialisé par le conteneur MySQL au premier démarrage.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=chatop
app.jwt.ttl=${JWT_TTL:PT1H}
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
server.error.include-message=never
server.error.include-stacktrace=never

app.upload-dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
