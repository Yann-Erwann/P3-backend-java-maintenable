openapi: 3.0.3
info:
  title: ChaTop
  version: 1.0.0
  description: API ChaTop avec authentification JWT.
servers:
  - url: http://localhost:8080/api
    description: Backend Spring Boot (routes disponibles à cette étape)
  - url: http://localhost:3001/api
    description: Mockoon (réponses statiques)
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      operationId: register
      summary: Inscrire un utilisateur
      tags:
        - Authentification
      responses:
        '200':
          description: 'JWT émis après inscription ou connexion réussie (backend et mock : HTTP 200)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccess'
        '400':
          description: 'Backend : champs absents, format invalide ou mot de passe trop long en UTF-8'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Backend : email déjà utilisé, y compris lors d’inscriptions concurrentes'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      description: >-
        Backend : email normalisé, nom non vide et mot de passe de 8 caractères minimum, au plus 72 octets UTF-8. Le mot
        de passe est haché avec BCrypt ; un JWT valable une heure par défaut est renvoyé. Le mock conserve ses réponses
        statiques.
  /auth/login:
    post:
      operationId: login
      summary: Se connecter
      tags:
        - Authentification
      responses:
        '200':
          description: 'JWT émis après inscription ou connexion réussie (backend et mock : HTTP 200)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccess'
        '400':
          description: 'Backend : champs absents, format invalide ou mot de passe trop long en UTF-8'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Backend : identifiants incorrects'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      description: >-
        Backend : email et mot de passe obligatoires ; mauvais identifiants et utilisateur inconnu renvoient la même
        erreur 401. Aucun compte de démonstration n’est créé automatiquement. Le mock utilise test@test.com / test!31 ;
        sa règle d’erreur teste login au lieu de email.
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Consulter l’utilisateur connecté
      tags:
        - Authentification
      responses:
        '200':
          description: Succès (réponse exacte du mock)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                name: Test TEST
                email: test@test.com
                created_at: 2022/02/02
                updated_at: 2022/08/02
        '401':
          description: Authentification refusée
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example: {}
      description: >-
        Backend : profil du propriétaire du JWT sans mot de passe. Un jeton absent, invalide ou expiré est refusé avec
        HTTP 401. Le mock renvoie son profil statique.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Backend : copier le token obtenu par register ou login dans Authorize. Mockoon uniquement : saisir jwt. Ne pas
        ajouter le préfixe Bearer dans Swagger UI.
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          example: test@test.com
        password:
          type: string
          example: test!31
          format: password
      required:
        - email
        - password
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          example: Test TEST
        email:
          type: string
          example: test@test.com
        password:
          type: string
          example: test!31
          format: password
      required:
        - name
        - email
        - password
    AuthSuccess:
      type: object
      properties:
        token:
          type: string
          description: 'Backend : JWT signé. Mock : chaîne fictive jwt.'
      required:
        - token
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - name
        - email
        - created_at
        - updated_at
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
