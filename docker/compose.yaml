services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chatop}
      MYSQL_USER: ${MYSQL_USER:-chatop}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD in backend/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute="SELECT 1" >/dev/null 2>&1'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mockoon:
    image: mockoon/cli:9
    restart: unless-stopped
    command: ["--data", "/data/rental-oc.json", "--port", "3001", "--hostname", "0.0.0.0"]
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./frontend/ressources/mockoon/rental-oc.json:/data/rental-oc.json:ro

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        API_MODE: ${API_MODE:-mock}
    restart: unless-stopped
    depends_on:
      - mockoon
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - ./frontend/src:/app/src:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chatop}
      MYSQL_USER: ${MYSQL_USER:-chatop}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD in backend/.env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET in backend/.env}
      JWT_TTL: ${JWT_TTL:-PT1H}
      UPLOAD_DIR: /app/uploads
    volumes:
      - rental_images:/app/uploads
    ports:
      - "127.0.0.1:8080:8080"

  swagger-ui:
    image: docker.swagger.io/swaggerapi/swagger-ui:latest
    restart: unless-stopped
    environment:
      SWAGGER_JSON: /spec/swagger.yml
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./backend/swagger.yml:/spec/swagger.yml:ro

volumes:
  mysql_data:
  rental_images:
